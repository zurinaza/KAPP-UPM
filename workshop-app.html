ing through STEM-based activity in groups of 4 for a 3-hour session. Activity involved building a 'Power Tower' using a golf ball, 15 pipe cleaners, and 3 straws.",assessment:"Summative Assessment of the Prototype, Teamwork, and Reflection analysis. Graded for specific Programme Outcomes (PO).",research:"Research data collection through designed questionnaires and student feedback.",impact:"100% of students found it fun, 98% improved critical thinking, 96% analytical skills, and 98% teamwork. Won 1 Bronze Medal in PICTL."},{id:3,title:"Comprehensive CAD Assessment",context:"Computer Aided Drawing",problem:"Complaints received and similarities in submitted drawings raised concerns about plagiarism. Traditional grading based on submitted drawings was unable to detect plagiarism and determine students' actual hands-on drawing competencies.",objective:"To tackle plagiarism among students and introduce a comprehensive assessment as a standard to evaluate student competencies based on drawing (cognitive part) plus hands-on demonstration (psychomotor assessment).",innovation:"Shifted to a Comprehensive Assessment consisting of Cognitive (Drawing) and Psychomotor (Hands-on) parts.",methodology:"The module is divided into: 1. Drawing assignment (90%) and 2. Hands-on demonstration by student (10%) evaluated by the lecturer guided by a specific rubric.",assessment:"Summative Assessment (100%) broken down into 90% Drawing and 10% Psychomotor hands-on test.",research:"Research data collection through designed questionnaires and student feedback.",impact:"Eradicated the plagiarism loophole. Students acknowledged that the combination of psychomotor assessment and drawing gave a better reflection of their skills. Won 1 Gold Medal in PICTL."},{id:4,title:"Experiment-Based Assessment as Alternative to Classroom Test",context:"Physical Separation",problem:"Typical assessments were conducted in a traditional classroom setting, paper-based, individual, and cognitive-focused. These failed to provide a meaningful learning experience.",objective:"To enhance the student learning experience through assessment via an experiential and collaborative learning approach.",innovation:"Replaced the standard paper test with an experiment-based assessment style.",methodology:"Experiential learning through an experiment-based assessment in pairs over a 3-hour session (e.g., drying apples and calculating moisture loss).",assessment:"Experiment data collected, analyzed, and engineering calculations graded for the student test mark.",research:"Research data collection through designed questionnaires and student feedback.",impact:"Over 75% of students strongly agreed that working in pairs allowed them to work and learn more effectively. It stimulated critical thinking and provided better visualization."},{id:5,title:"Industrial Application – Tracing Line Activities",context:"Computer Aided Drawing (Industrial Application)",problem:"Process and Instrumentation Diagrams (P&ID) are widely used in industry to represent process plants. They can be complicated to read and need to be reflected on the actual plant, requiring training to master.",objective:"To expose students to reading P&ID in comparison to an actual plant in real applications in the industry.",innovation:"Implemented challenge-based 'tracing line' activities using actual Boiler Drum Control Equipment in the laboratory.",methodology:"A '3-in-1 PID Maze': PID Symbols compilation (Flipped Classroom), PID Maze (3-hour session, tracing line challenge), and Mystery Unravel (presentation of flow logic).",assessment:"Summative Assessment via Drawing Portfolio (Cognitive), Quiz, and Tracing Line Activities (Psychomotor).",research:"Research data collection through designed questionnaires and student feedback.",impact:"Provided highly interactive, work-related knowledge that replicated real plant environments. Demonstrated commercialization potential for TVET training. Won 1 Gold Medal in PICTL 2020."}],HT=[{traditional:"2-hour Monologue Lecture",innovative:"Microlearning & Polling: Break lectures into 15-minute chunks separated by a quick interactive quiz.",shift:"Passive listening → Active recall and engagement."},{traditional:"Paper-based Quiz",innovative:"Experiment-Based Assessment: Students dry an apple and calculate moisture loss instead of answering a test paper.",shift:"Rote memorization → Experiential learning and application."},{traditional:"Standard Written Essay",innovative:"Reflective Journal / Video Pitch: Students record a 60-second explanation of a complex concept.",shift:"Information regurgitation → Synthesis and communication."},{traditional:"100% Final Product Grade",innovative:"Process-Oriented Grading: Assess the drafts, teamwork, and physical prototype alongside the final drawing.",shift:"Outcome-focused → Process and critical thinking focused."}],QT=[{title:"Connectivity, Compassion, and Empathy",desc:"Teaching without knowing your students is like teaching without a soul. Build rapport, memorize names, and create memorable moments."},{title:"Do-Sense-Feel (Multisensory)",desc:"Make use of human senses (visual, auditory, kinesthetic, tactile) to create the 'feel' or emotions that stimulate greater cognitive development."},{title:"Togetherness and Empowerment",desc:"Adopt a growth mindset and build authentic mentorships to help students prioritize learning. Your authentic relationship empowers them."}],fc=[{step:1,title:"Identify the Problem",desc:"What is actually going wrong in your course?"},{step:2,title:"Diagnose the Cause",desc:"Why is it happening?"},{step:3,title:"Choose a Pedagogical Construct",desc:"Name the model (e.g., Flipped Classroom, PBL)."},{step:4,title:"Design the Activity",desc:"What will the students actually do? E.g., Experiential, Hands-on, Collaboration."},{step:5,title:"Build the Evidence Plan",desc:"Decide what data you will collect before you run it for SoTL purposes."}],wo={framework:[{question:"In the context of the teaching framework, which elements are considered 'Micro Level' (things you can modify)?",options:["Course Syllabus and Timetable","Student List and Curriculum","Delivery Methods and Assessments","Programme Outcomes (PO)"],correct:2,explanation:"Macro-level items (syllabus, timetable) are hard to change. Micro-level items like delivery methods, assessments, and teaching materials are where you have full control to innovate."},{question:"What is the primary goal of the Scholarship of Teaching and Learning (SoTL)?",options:["To publish textbooks for university students","To systematically investigate student learning to improve teaching and share findings","To apply for more research grants in engineering","To evaluate other lecturers' performance"],correct:1,explanation:"SoTL involves rigorous inquiry into student learning, using evidence to improve teaching practices, and sharing those findings publicly (e.g., conferences, publications)."}],assessment:[{question:"Why is a comprehensive assessment (e.g., 90% drawing + 10% psychomotor demonstration) effective for software-based assignments?",options:["It is easier for the lecturer to grade.","It allows students to finish the test faster.","It determines actual hands-on software competency and eradicates plagiarism.","It relies solely on cognitive recall."],correct:2,explanation:"Adding a live, hands-on (psychomotor) component ensures that the student actually possesses the competency to perform the task, which helps eliminate plagiarism in submitted work."}],sustainability:[{question:"Which of the following is a good tip for sustaining motivation throughout a 14-week semester?",options:["Always follow an extremely strict and unchangeable teaching plan.","Grade all assignments in one large batch at the end of the semester.","Break down the work into small tasks and set realistic targets (e.g., mark 10 per day).","Avoid asking for student opinions until the final course evaluation."],correct:2,explanation:"Breaking work into smaller, manageable tasks helps prevent burnout and sustains motivation throughout the semester."}]},qT=[{title:"It is intentional",desc:"It answers a problem you actually identified in your own course — not a trend, and not a call for proposals.",fail:"Chasing a tool because everyone is talking about it."},{title:"It changes what students do",desc:"Their cognitive process differs. What happens inside the student's head is not the same as before.",fail:"Same task, new device. The thinking is unchanged."},{title:"It is evidenced",desc:"You can show that something improved — marks, attainment, competency, or transfer to a new context.",fail:"Students said they enjoyed it, and nothing else was measured."}],YT=[{layer:"Theory",desc:"The account of how people learn",examples:"Constructivism, active learning, multisensory learning",depth:1},{layer:"Pedagogical approach",desc:"The named model you are drawing on",examples:"PBL, flipped classroom, experiential, collaborative, challenge-based",depth:2},{layer:"Learning activity",desc:"The specific thing students actually do",examples:"Build the tower, dry the sample, trace the line on the real plant",depth:3},{layer:"Tool",desc:"What you deliver it with",examples:"Kahoot, video, Visio, a rubric, an AI model",depth:4}],GT=[{title:"Curriculum & content",desc:"What is taught, the sequence, and its currency with industry practice."},{title:"Pedagogy & delivery",desc:"How it is taught — flipped, PBL, collaborative, immersive."},{title:"Assessment",desc:"What is graded and how. The highest-leverage type, and the one lecturers assume they may not touch."},{title:"Learning environment",desc:"Lab, pilot plant, site visit, outdoor, virtual, or the industry floor."},{title:"Technology-enabled",desc:"Only counts as innovation when the tool changes the activity, not just the delivery."},{title:"Learning support",desc:"Peer teaching, mentoring, self-access material, video demos."}],XT=["Students disengaged, or passing without understanding","One Course Outcome consistently under-attained, year after year","Resource shortage — no demonstrators, no equipment, no time","Class size has defeated the method that used to work","A gap between what you teach and what industry now does","Assessment integrity — plagiarism, and now generative AI","Accreditation shift — new EAC definitions, new WK / WP / EA"],ZT=[{name:"Constructivism & Active Learning",accent:"blue",principle:"Students construct understanding rather than receive it.",looksLike:"An open-ended problem with no obvious solution; the lecturer facilitates instead of answering.",example:"Students derive the design approach themselves before you show the standard method."},{name:"Flipped Classroom (Kelas Berbalik)",accent:"emerald",principle:"Direct instruction moves out; class time becomes the hard part.",looksLike:"Material consumed at home, contact hours spent on challenge and collaboration.",example:"P&ID symbols compiled as pre-work, then a three-hour tracing challenge in class."},{name:"Experiential / Hands-On",accent:"amber",principle:"Learning through concrete experience, then reflection (Kolb's cycle).",looksLike:"Students do the real thing under professional constraints, then analyse what happened.",example:"Drying apple samples, collecting data, and defending the rate curve."},{name:"Multisensory Pedagogy",accent:"purple",principle:"Multiple senses at once build richer cognitive connections.",looksLike:"Something to see, touch, hear or smell — not a description of it.",example:"A real rose lets one smell its sweetness and feel the petals; an image cannot."},{name:"Collaborative & Problem-Based Learning",accent:"rose",principle:"Genuine interdependence, where the task cannot be done alone.",looksLike:"Small teams, a shared deliverable, and individual accountability within it.",example:"Groups of four building a free-standing Power Tower against a specification."},{name:"Challenge-Based Immersive Learning",accent:"indigo",principle:"A real, bounded challenge in an authentic setting drives the learning.",looksLike:"Time pressure, real equipment, and a problem with a right answer they must find.",example:"Tracing the flow on actual Boiler Drum Control Equipment in the pilot plant."},{name:"Assessment-as-Learning",accent:"teal",principle:"The assessment produces learning while it measures it.",looksLike:"A test students would still benefit from even if it were ungraded.",example:"An experiment-based continuous assessment replacing the paper test."}],KT=[{scenario:"You move your weekly paper quiz into Kahoot. Same questions, same timing, same follow-up.",question:"Innovation, or not?",options:["Innovation — it uses modern technology","Substitution — the tool changed, the thinking did not","Innovation — students enjoy it more","Not innovation — because it is free to run"],correct:1,explanation:"The quiz is identical; only the delivery device changed. Enjoyment is not evidence of learning. This is substitution at the tool layer."},{scenario:"You use the same Kahoot — but when you see 60% choose the wrong option, you stop and reteach that concept for the next twenty minutes.",question:"Innovation, or not?",options:["Substitution — it is still just Kahoot","Innovation — the live data now redirects the teaching","Not innovation — the tool is unchanged from before","Innovation — because it saves marking time"],correct:1,explanation:"Same tool as the previous question, different answer. The feedback loop changed what happens in the room and what students then do. Innovation reached the activity layer."},{scenario:"You record all your lectures so students can rewatch them before the final exam. Class time continues exactly as before.",question:"Innovation, or not?",options:["Innovation — it is a flipped classroom","Substitution — access improved, the learning process did not","Innovation — it supports different learning styles","Not innovation — recordings reduce attendance"],correct:1,explanation:"This is augmentation, and it is genuinely useful. But it is not flipping: flipping requires class time to be repurposed for challenge and collaboration. Nothing about the students' cognitive work changed."},{scenario:"You replace the written classroom test with an experiment that pairs of students design, run, and defend with their own calculations.",question:"Innovation, or not?",options:["Substitution — it is still just a test","Innovation — the assessment now produces the learning","Not innovation — because no technology is involved","Innovation — because it is harder to mark"],correct:1,explanation:"Assessment-as-learning. Students now analyse, decide and defend rather than recall. Note that no technology appears anywhere — innovation does not require it."},{scenario:"You redesign an activity, students tell you they loved it, and you write it up for a conference. You collected no marks data and had no comparison cohort.",question:"Does it qualify as an evidenced innovation?",options:["Yes — student feedback is valid evidence","Not yet — it passes tests one and two but fails the evidence test","Yes — conference acceptance proves the impact","No — the activity itself was not innovative"],correct:1,explanation:"The design may be excellent. But satisfaction is the weakest level of evidence, and students often rate the lecture they enjoyed above the activity that taught them more. Plan the data before you run it."},{scenario:"You ask AI to generate three times as many practice questions and upload them all to the course page.",question:"Innovation, or not?",options:["Innovation — AI is involved","Substitution — more of the same task, produced faster","Not innovation — because AI made it, not you","Innovation — variety prevents cheating"],correct:1,explanation:"Volume is not pedagogy. This would become innovation if the extra questions enabled something new — mastery-based retries until competence, for example — because then what students do would change."},{scenario:"Students build a physical prototype, then compare it against the CAD drawing they produced earlier and explain every difference.",question:"Innovation, or not?",options:["Substitution — drawing was already part of the course","Innovation — comparison and reflection are new cognitive work","Not innovation — building models is a very old method","Innovation — because students find it fun"],correct:1,explanation:"The prototype alone would be an activity swap. The comparison step forces students to confront the gap between their plan and reality — that reflection is the pedagogical addition, and it is what makes it Kolb's experiential cycle."}],JT=[{scenario:"Students compile P&ID symbols as pre-work at home. The entire three-hour contact session is then spent solving a tracing maze in teams.",question:"Which pedagogy is this?",options:["Multisensory Pedagogy","Flipped Classroom","Constructivism","Assessment-as-Learning"],correct:1,explanation:"Direct instruction moved out of the classroom, and contact time was repurposed for the difficult, collaborative work. That is the defining structure of a flipped classroom."},{scenario:"Pairs of students dry apple samples in an oven, weigh them at intervals, plot the drying curve, and calculate the critical moisture content.",question:"Which pedagogy is this?",options:["Flipped Classroom","Experiential / Hands-On","Direct Instruction","Peer Instruction"],correct:1,explanation:"Concrete experience followed by analysis and reflection — Kolb's experiential cycle. Students learn the concept by generating the data themselves rather than being shown it."},{scenario:"You bring real roses into class so students can smell the sweetness and feel the petals, rather than showing a photograph on a slide.",question:"Which pedagogy is this?",options:["Multisensory Pedagogy","Experiential Learning","Constructivism","Challenge-Based Learning"],correct:0,explanation:"Multisensory pedagogy engages several senses at once to build richer cognitive connections. The Do-Sense-Feel philosophy: emotion and sensation stimulate deeper cognitive development."},{scenario:"Groups of four are given one golf ball, fifteen pipe cleaners and three straws, and must build the tallest free-standing tower to a specification in ten minutes.",question:"Which pedagogy is this?",options:["Direct Instruction","Collaborative & Problem-Based Learning","Flipped Classroom","Multisensory Pedagogy"],correct:1,explanation:"A shared deliverable that genuinely cannot be produced alone, under constraints, with individual accountability inside the team. Collaborative PBL — and it also carries an experiential reflection stage."},{scenario:"You pose an open-ended design problem with no obvious solution. You refuse to give the answer, and instead ask questions that help students build their own approach.",question:"Which pedagogy is this?",options:["Constructivism & Active Learning","Assessment-as-Learning","Experiential Learning","Flipped Classroom"],correct:0,explanation:"Students construct understanding rather than receive it, with the lecturer as facilitator. The withholding of the answer is the pedagogical move, not an omission."},{scenario:"Students go into the pilot plant and must trace the actual flow path on live Boiler Drum Control Equipment to match it against the diagram, against the clock.",question:"Which pedagogy is this?",options:["Multisensory Pedagogy","Challenge-Based Immersive Learning","Direct Instruction","Peer Assessment"],correct:1,explanation:"A real, bounded challenge in an authentic industrial setting, with time pressure and a findable right answer. Immersion in the real environment is what separates this from a classroom exercise."},{scenario:"The continuous assessment is itself the experiment. Students would still gain the understanding even if the task carried no marks at all.",question:"Which pedagogy is this?",options:["Summative Testing","Assessment-as-Learning","Flipped Classroom","Constructivism"],correct:1,explanation:"The test is the ungraded-value criterion: if students would still learn from it without marks, the assessment is producing learning rather than only measuring it."}],Kg=[{item:"Curriculum & course syllabus",owner:"Faculty / Senate",why:"Approved at faculty level and locked for the accreditation cycle.",leverage:"You cannot remove a topic — but the depth, sequence and framing within it are yours."},{item:"CO–PO mapping",owner:"Programme committee",why:"Each Course Outcome is formally mapped to Programme Outcomes and taxonomy levels.",leverage:"The mapping is fixed; how you evidence attainment against it is not."},{item:"EAC requirements (WK / WP / EA)",owner:"Engineering Accreditation Council",why:"Knowledge Profiles, Complex Problem attributes and Engineering Activities are externally defined.",leverage:"You choose which activities demonstrate them — and most courses under-use EA."},{item:"Credit hours & SLT",owner:"University",why:"Student Learning Time is fixed by the credit structure.",leverage:"The split between lecture, tutorial and independent learning within it is negotiable."},{item:"Timetable & room allocation",owner:"Faculty administration",why:"Slots and venues are centrally scheduled across programmes.",leverage:"Book a lab, plant or outdoor space early and the venue stops being a constraint."},{item:"Student list & cohort size",owner:"Registrar",why:"You teach whoever enrols, in whatever number.",leverage:"Grouping, pairing and roles within the cohort are entirely your design."}],Jg=[{item:"Lecture notes & teaching materials",why:"Everything students read, watch or handle is authored by you.",example:"Replace a static diagram with a video demo, or a real object they can handle."},{item:"Delivery mode & platform",why:"How the content reaches them — and whether they are passive while it does.",example:"Flip the lecture, run a space lecture, or bring in an industry speaker."},{item:"Learning activities",why:"The single highest-value thing you control: what students actually DO.",example:"Build a tower, dry a sample, trace a live line on the pilot plant."},{item:"Assessment design & format",why:"Within the approved weighting, the FORM of the assessment is yours.",example:"An experiment-based test instead of a paper test, at the same 15%."},{item:"Sequencing within a topic",why:"What comes first changes what students are ready to understand.",example:"Let them fail at the problem first, then teach the method they needed."},{item:"Feedback & classroom climate",why:"How safe it feels to be wrong determines how much thinking happens out loud.",example:"Live polling that redirects your teaching instead of just scoring them."}],_T={number:"01",title:"The TikTok Challenge",subtitle:"Sixty seconds on the innovation you just designed",duration:"24 minutes",task:"Use AI tools to make a vertical video, 60 seconds or less, about the innovation on your canvas — the problem, and what students will now do differently. Post it to the challenge account.",done:["Posted to the challenge account, with the hashtag","AI-generated content toggle switched on","In-app sounds only","One sentence in the caption naming the problem it solves"],timing:[{time:"5 min",label:"Script it from your canvas"},{time:"14 min",label:"Generate, assemble, trim"},{time:"5 min",label:"Post and tag"}],note:"Account created before today. If yours failed, pair up now.",rules:[{rule:"Label the AI content",detail:"Use the built-in AI-generated toggle. You are modelling the disclosure practice you want your own students using."},{rule:"Challenge account only",detail:"Never your personal account. An opt-out exists — the shared folder counts as submitted."},{rule:"Nobody in frame who did not agree",detail:"No students, no colleagues passing, no name tags or ID badges. A dedicated account is still public."},{rule:"In-app sounds only",detail:"External music invites a takedown, and a removed video is a lost artefact."},{rule:"One shared hashtag",detail:"So every entry is findable in the showcase — and afterwards, as evidence."}],judging:["Is the problem real — not a topic, but something going wrong?","Is the change pedagogical — does what students DO change?","Is there a hook in the first three seconds?","Would a colleague steal this idea?"]},WT={number:"02",title:"The Vibe Coding Challenge",subtitle:"Build a small game that teaches one concept from your course",duration:"25 minutes",task:"Describe a simple browser game in plain language and let AI build it. The game must teach one specific concept your students struggle with. You never read the code — you play it, judge it, and describe what is wrong until it is right.",loop:[{step:"Describe",detail:"In plain English or Malay. Who plays, what they do, what they should notice."},{step:"Play",detail:"You get something working, usually imperfect. Play it as a student would."},{step:"Correct",detail:"Say what is wrong in words — 'the score should drop when the valve is wrong' — and it rebuilds."}],skeleton:[{field:"Who the learner is",example:"Second-year chemical engineering students"},{field:"What one concept",example:"Why the drying rate stops being constant"},{field:"What the player does",example:"Drag the air temperature and velocity sliders to hit a target drying time"},{field:"What they should notice",example:"The critical moisture content shifts as conditions change"},{field:"One constraint",example:"One screen, no scrolling, works on a phone"}],ideas:[{title:"P&ID Symbol Match",desc:"Timed matching game pairing instrumentation symbols to their real equipment photo."},{title:"Drying Curve Sliders",desc:"Adjust temperature and air velocity to hit a target drying time; the curve redraws live."},{title:"Mass Balance Puzzle",desc:"Drag stream values into a flowsheet until the balance closes — wrong answers show the error."},{title:"Unit Conversion Sprint",desc:"Sixty seconds, as many correct engineering unit conversions as possible."},{title:"Separation Sorter",desc:"Match a mixture to the corre
